<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src https://wcsgyncbkxkcshomvloh.supabase.co; base-uri 'none'; form-action 'none'"><title>AdiPiña</title><style>
  *{box-sizing:border-box}body{background:#fbf8ed;color:#343548;font-family:system-ui,sans-serif;margin:0;padding:28px 20px}main{max-width:680px;margin:auto}h1{font-size:42px}p{line-height:1.6}[hidden]{display:none!important}a.secondary{background:#fffdf7;color:#ad584b;border:1px solid #ad584b;margin-top:10px}a{display:inline-block;padding:16px 24px;border-radius:16px;background:#ad584b;color:#fffdf7;text-decoration:none}strong{font-size:40px;letter-spacing:.08em}ol{padding:0;list-style:none}li{display:flex;justify-content:space-between;gap:16px;background:#fffdf7;border:1px solid #868072;padding:18px;margin:10px 0;border-radius:16px}#clock{font-size:48px}small{color:#615d66}</style><main><h1>AdiPiña</h1><section id="invite"><p data-t="lead"></p><p id="code-line" hidden><span data-t="code"></span> <strong id="code"></strong></p><a id="open" href="adipina://join/" data-t="open"></a> <a id="play" class="secondary" hidden data-t="play"></a><p data-t="install"></p></section><section id="board" hidden><p id="status"></p><div id="clock"></div><ol id="teams"></ol><small data-t="private"></small></section></main><script>
  const API="https://wcsgyncbkxkcshomvloh.supabase.co/functions/v1/adipina",PLAY="https://sergioiglesiasleite.github.io/adipina-legal/prueba/",TEXTS={"es":{"lead":"Un móvil por piña. Abre AdiPiña para unirte al equipo.","code":"Código de sala:","open":"Abrir AdiPiña","play":"Jugar en el navegador","install":"Si todavía no la tienes instalada, instala la app y entra en «Unirme con código» con el código de sala.","private":"Las respuestas solo aparecen en el móvil de quien da las pistas.","unavailable":"La sala no está disponible.","room":"Sala","waiting":"Esperando a las piñas","reconnecting":"Conexión interrumpida. Reconectando…","phases":{"playing":"En juego","paused":"Partida en pausa","handoff":"Preparando turno","summary":"Fin del turno","finished":"Partida terminada","exhausted":"Sin tarjetas"}},"en":{"lead":"One phone per team. Open AdiPiña to join your team.","code":"Room code:","open":"Open AdiPiña","play":"Play in the browser","install":"If you don’t have it yet, install the app and go to “Join with a code” with the room code.","private":"Answers only appear on the phone of whoever gives the clues.","unavailable":"The room isn’t available.","room":"Room","waiting":"Waiting for the teams","reconnecting":"Connection lost. Reconnecting…","phases":{"playing":"Playing","paused":"Game paused","handoff":"Getting the turn ready","summary":"End of the turn","finished":"Game over","exhausted":"No cards left"}}};
  const chosen=new URLSearchParams(location.search).get('lang'),lang=TEXTS[chosen]?chosen:String(navigator.languages?.[0]||navigator.language||'es').toLowerCase().startsWith('es')?'es':'en',T=TEXTS[lang];
  document.documentElement.lang=lang;for(const el of document.querySelectorAll('[data-t]'))el.textContent=T[el.dataset.t];
  const invited=(new URLSearchParams(location.search).get('sala')||'').match(/^\d{6}$/)?.[0];
  if(invited){document.getElementById('code').textContent=invited;document.getElementById('code-line').hidden=false;document.getElementById('open').href='adipina://join/?sala='+invited;if(PLAY){const play=document.getElementById('play');play.href=PLAY+'?sala='+invited;play.hidden=false;}}
  const marker=location.hash.match(/^#marcador=(\d{6})\.([a-f0-9]{48})$/);
  if(marker){
    const token=marker[2],code=marker[1],base=(API||location.origin+location.pathname).replace(/\/$/,'');
    history.replaceState(null,'',location.pathname);document.getElementById('invite').hidden=true;document.getElementById('board').hidden=false;
    const status=document.getElementById('status'),clock=document.getElementById('clock'),teams=document.getElementById('teams');
    let end=0,remaining=0,playing=false,stopped=false;
    setInterval(()=>{const ms=playing?Math.max(0,end-performance.now()):remaining;const s=Math.ceil(ms/1000);clock.textContent=Math.floor(s/60).toString().padStart(2,'0')+':'+(s%60).toString().padStart(2,'0')},200);
    async function poll(){let delay=3500;try{
      const response=await fetch(base+'/api/rooms/'+code,{headers:{Authorization:'Bearer '+token}});const data=await response.json();
      // Room servers answer in Spanish: that text is kept for a Spanish board, the general one otherwise.
      if(!response.ok){status.textContent=lang==='es'&&data.error||T.unavailable;if([401,404,410].includes(response.status))stopped=true;}
      else{const state=data.state;status.textContent=state?T.room+' '+code+' · '+(T.phases[state.phase]||''):T.waiting;
        remaining=state?.remaining||0;playing=state?.phase==='playing';end=performance.now()+remaining;teams.replaceChildren();
        for(const team of [...(state?.teams||data.teams)].sort((a,b)=>(b.score||0)-(a.score||0))){const row=document.createElement('li'),name=document.createElement('span'),score=document.createElement('b');name.textContent=team.name;score.textContent=(team.score||0)+' pts';row.append(name,score);teams.append(row)}
        delay=data.pollAfter||3500;}
    }catch{status.textContent=T.reconnecting;delay=5000}if(!stopped)setTimeout(poll,delay)}poll();
  }
</script></html>
